<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taboola Widget Test Page</title>
    <!-- Tailwind CSS -->
    <script src="<redacted URL>"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="<redacted URL>"></script>
    <script crossorigin src="<redacted URL>"></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="<redacted URL>"></script>

    <!-- Taboola JS Tag Loader -->
    <script type="text/javascript">
        window._taboola = window._taboola || [];
        _taboola['sync'] = 'async';
        _taboola['cdn'] = 'cdn.taboola.com';
        (function (e, f, u, i) {
            if (!document.getElementById(i)) {
                e.async = 1;
                e.src = u;
                e.id = i;
                f.parentNode.insertBefore(e, f);
            }
        })(document.createElement('script'),
            document.getElementsByTagName('script')[0],
            '<redacted URL>',
            'tb_loader_script');
        if (window.performance && typeof window.performance.mark == 'function') { window.performance.mark('tbl_ic'); }
    </script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // Header Component
        function Header() {
            return (
                <header className="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
                    <div className="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                        <div className="flex items-center space-x-2">
                            <span className="text-xl font-black tracking-tight text-blue-600">NEWS<span className="text-gray-900">DAILY</span></span>
                            <span className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded border border-gray-200">Test Portal</span>
                        </div>
                        <nav className="hidden md:flex space-x-6 text-sm font-medium text-gray-600">
                            <a href="#" className="hover:text-blue-600">Home</a>
                            <a href="#" className="hover:text-blue-600">Tech</a>
                            <a href="#" className="hover:text-blue-600">Business</a>
                            <a href="#" className="hover:text-blue-600">Lifestyle</a>
                        </nav>
                    </div>
                </header>
            );
        }

        // Taboola Dynamic Placement Widget (Pure Taboola Tag / Preview Integration)
        function TaboolaDynamicPlacementWidget({ containerId, placement, mode, targetType = 'mix' }) {
            React.useEffect(() => {
                window._taboola = window._taboola || [];
                _taboola.push({
                    mode: mode,
                    container: containerId,
                    placement: placement,
                    target_type: targetType
                });
                _taboola.push({ flush: true });
            }, [containerId, placement, mode, targetType]);

            return (
                <div className="w-full max-w-[1200px] mx-auto mb-8 bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                    {/* Taboola Target Container - Pure empty container populated dynamically by TRC / loader.js */}
                    <div id={containerId} className="w-full min-h-[300px]"></div>
                </div>
            );
        }

        // Main Article Component
        function Article() {
            return (
                <article className="bg-white p-6 sm:p-8 rounded-lg shadow-sm border border-gray-200 mb-8">
                    <div className="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-blue-600 mb-3">
                        Technology & AdTech
                    </div>
                    <h1 className="text-2xl sm:text-4xl font-bold text-gray-900 leading-tight mb-4">
                        Understanding Modern Ad Creatives & Real-Time Video Serving
                    </h1>
                    <div className="flex items-center text-xs text-gray-400 mb-6 space-x-4 border-b border-gray-100 pb-4">
                        <span>By Tech Editorial Desk</span>
                        <span>•</span>
                        <span>Updated Today</span>
                        <span>•</span>
                        <span>3 min read</span>
                    </div>

                    <p className="text-base sm:text-lg text-gray-700 leading-relaxed mb-4">
                        Digital advertising technology continues to evolve rapidly with server-to-server attribution,
                        dynamic creative injection, and automated preview tooling. Modern publisher tags load creatives asynchronously
                        via creative preview parameters passed directly through the page URL.
                    </p>

                    <p className="text-base text-gray-600 leading-relaxed mb-4">
                        When testing live preview instructions (<code className="bg-gray-100 px-1 py-0.5 rounded text-xs text-red-600 font-mono">trc_preview_instruction_id</code>),
                        the Taboola JavaScript tag (<code className="bg-gray-100 px-1 py-0.5 rounded text-xs text-gray-800 font-mono">loader.js</code>) intercepts the query parameters,
                        contacts the preview syndicator engine, and replaces the container contents with the designated video player and hosted MP4 creative automatically.
                    </p>
                </article>
            );
        }

        // URL Parameters Debug Info Banner
        function UrlParamsDebugInfo() {
            const [params, setParams] = React.useState({});

            React.useEffect(() => {
                const searchParams = new URLSearchParams(window.location.search);
                const extracted = {};
                for (const [key, value] of searchParams.entries()) {
                    extracted[key] = value;
                }
                setParams(extracted);
            }, []);

            const hasPreviewParams = params.trc_preview_instruction_id || params.trc_preview_syndicator_id;

            return (
                <div className={`p-4 rounded-lg border mb-8 text-xs font-mono ${hasPreviewParams ? 'bg-green-50 border-green-200 text-green-900' : 'bg-amber-50 border-amber-200 text-amber-900'}`}>
                    <div className="font-bold flex items-center justify-between mb-2">
                        <span>Taboola Preview Parameter Status:</span>
                        <span className={`px-2 py-0.5 rounded text-[11px] font-sans ${hasPreviewParams ? 'bg-green-200 text-green-800 font-semibold' : 'bg-amber-200 text-amber-800'}`}>
                            {hasPreviewParams ? 'Preview Active' : 'No Preview Params Detected'}
                        </span>
                    </div>
                    {hasPreviewParams ? (
                        <div className="space-y-1">
                            <div><strong>trc_preview_syndicator_id:</strong> {params.trc_preview_syndicator_id || 'Not set'}</div>
                            <div><strong>trc_preview_instruction_id:</strong> {params.trc_preview_instruction_id || 'Not set'}</div>
                            <div><strong>tbl_disable_cache:</strong> {params.tbl_disable_cache || 'Not set'}</div>
                        </div>
                    ) : (
                        <div>
                            To preview your video creative dynamically via Taboola TRC, append your query string:
                            <br />
                            <code className="text-amber-800 break-all select-all font-bold">
                                ?tbl_disable_cache=true&trc_preview_syndicator_id=2107468&trc_preview_instruction_id=4363567569
                            </code>
                        </div>
                    )}
                </div>
            );
        }

        // App Component
        function App() {
            return (
                <div className="flex flex-col min-h-screen">
                    <Header />

                    <main className="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
                        {/* URL Params Debug Banner */}
                        <UrlParamsDebugInfo />

                        {/* Article Content */}
                        <Article />

                        {/* Taboola Video / Creative Placement Container */}
                        {/* Taboola's loader.js and TRC engine populate this container dynamically */}
                        <TaboolaDynamicPlacementWidget
                            containerId="taboola-mid-article-video"
                            placement="Mid Article Video"
                            mode="thumbnails-stream"
                            targetType="video"
                        />
                    </main>

                    <footer className="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-400">
                        Taboola Creative Preview Testing Environment &copy; 2026
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
